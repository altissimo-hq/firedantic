repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
      - id: trailing-whitespace
      - id: end-of-file-fixer
      # All non-bat files should end with LF
      - id: mixed-line-ending
        name: Ensure LF endings on most files
        args: ["--fix=lf"]
        exclude: \.bat$
      # Bat files should end with CRLF
      - id: mixed-line-ending
        name: Ensure CRLF endings on Windows files
        args: ["--fix=crlf"]
        files: \.bat$

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint
        args: ["--fix"]

  # Python linting and formatting with ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix]
      # Run the formatter
      - id: ruff-format

  # Type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        files: ^firedantic/_async/
        additional_dependencies:
          - pydantic>=2.12.4
          - types-protobuf

  # Local hooks
  - repo: local
    hooks:
      # Run unit tests (fast, no emulator needed)
      - id: pytest-unit
        name: Run unit tests
        entry: poetry run pytest -m unit --tb=short
        language: system
        pass_filenames: false
        types: [python]

      # Generate sync code from async
      - id: invoke-unasync
        name: Generate sync code from async
        entry: poetry run invoke unasync
        language: system
        pass_filenames: false
        files: ^firedantic/_async/

  # Security scanning
  - repo: https://github.com/twu/skjold
    rev: v0.6.2
    hooks:
      - id: skjold

  # Format non-Python files
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [yaml, json, markdown]
        exclude: ^\.venv/
