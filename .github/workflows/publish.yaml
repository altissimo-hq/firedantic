name: Build and publish to PyPI

on:
  push:
    tags:
      - "*"
  # Run by hand to publish the current main to TestPyPI, to check the package
  # before a release
  workflow_dispatch:

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🔁
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Set up Python 🐍
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Java ☕
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 #v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Firestore emulator 🚧
        run: |
          npm install -g firebase-tools

      - name: Start Firestore emulator 🚦
        run: |
          ./start_emulator.sh > emulator.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s http://127.0.0.1:8686 > /dev/null && exit 0
            sleep 1
          done
          echo "Firestore emulator did not start:"
          cat emulator.log
          exit 1

      - name: Install Poetry and pre-commit 💈
        run: pip install poetry==2.2.1 pre-commit

      - name: Install dependencies 🛠
        run: poetry install

      - name: Run pre-commit 🤔
        run: pre-commit run --all-files

      - name: Run tests 🌈
        run: poetry run invoke test

      - name: Check the tag matches the package version 🏷️
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(poetry version -s)"
          if [ "${GITHUB_REF_NAME}" != "${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi

      - name: Build the package 📦
        run: poetry build

      - name: Publish build artifact ⬆️
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: package-dist
          path: dist
  publish:
    name: Publish
    needs: build
    # Only publish tags from this repo, as altissimo-firedantic. Forks can't publish.
    if: github.repository == 'altissimo-hq/firedantic' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # this permission is mandatory for trusted publishing
      id-token: write
    steps:
      - name: Download build artifact ⬇️
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: package-dist
          path: dist

      - name: Publish package to PyPI 🙌
        if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e #v1.13.0
  publish-test:
    name: Publish to TestPyPI
    needs: build
    if: github.repository == 'altissimo-hq/firedantic' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      # this permission is mandatory for trusted publishing
      id-token: write
    steps:
      - name: Download build artifact ⬇️
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: package-dist
          path: dist

      - name: Publish package to TestPyPI 🧪
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e #v1.13.0
        with:
          repository-url: https://test.pypi.org/legacy/
          # A version can only be uploaded once, so reruns skip it
          skip-existing: true
