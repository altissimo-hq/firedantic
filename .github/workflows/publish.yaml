name: Build and publish to PyPI

on:
  push:
    tags:
      - "*"
  # Run by hand to publish the current main to TestPyPI, to check the package
  # before a release
  workflow_dispatch:

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🔁
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Set up Python 🐍
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Set up Java ☕
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Firestore emulator 🚧
        run: |
          npm install -g firebase-tools

      - name: Start Firestore emulator 🚦
        run: |
          ./start_emulator.sh > emulator.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s http://127.0.0.1:8686 > /dev/null && exit 0
            sleep 1
          done
          echo "Firestore emulator did not start:"
          cat emulator.log
          exit 1

      - name: Install Poetry and pre-commit 💈
        run: pip install poetry==2.2.1 pre-commit

      - name: Install dependencies 🛠
        run: poetry install

      - name: Run pre-commit 🤔
        run: pre-commit run --all-files

      - name: Run tests 🌈
        run: poetry run invoke test

      - name: Check the tag matches the package version 🏷️
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(poetry version -s)"
          if [ "${GITHUB_REF_NAME}" != "${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi

      - name: Build the package 📦
        run: poetry build

      - name: Publish build artifact ⬆️
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-dist
          path: dist
  publish:
    name: Publish
    needs: build
    # Only publish tags from this repo, as altissimo-firedantic. Forks can't publish.
    if: github.repository == 'altissimo-hq/firedantic' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # this permission is mandatory for trusted publishing
      id-token: write
    steps:
      - name: Download build artifact ⬇️
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-dist
          path: dist

      - name: Publish package to PyPI 🙌
        if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
  publish-test:
    name: Publish to TestPyPI
    needs: build
    if: github.repository == 'altissimo-hq/firedantic' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      # this permission is mandatory for trusted publishing
      id-token: write
    steps:
      - name: Download build artifact ⬇️
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-dist
          path: dist

      - name: Publish package to TestPyPI 🧪
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          # A version can only be uploaded once, so reruns skip it
          skip-existing: true
